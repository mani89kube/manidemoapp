apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-applications
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - name: app1
          - name: app2
          - name: app3

  template:
    metadata:
      name: '{{ .name }}-prod'

    spec:
      project: default

      source:
        #  repoURL: https://github.com/mani89kube/manidemoapp.git
        repoURL: https://github.com/mani89kube/manidemoapp.git
        targetRevision: main
        path: aug1/shelm/helm-chart

        helm:
          valueFiles:
            - '../../environments/prod/{{ .name }}/values.yaml'

      destination:
        server: https://kubernetes.default.svc
        namespace: prod

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
