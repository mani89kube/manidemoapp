apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mani2-frontend-deployment-hpa
  namespace: surya
spec:
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
